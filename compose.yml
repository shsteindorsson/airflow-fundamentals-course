services:
  weather-db:
    container_name: postgres17
    image: docker.io/library/postgres:17
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: weather
      POSTGRES_DB: weather
      POSTGRES_PASSWORD: weather
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
volumes:
  postgres-data: