services:
  postgres:
    container_name: postgres17
    image: docker.io/postgres:17-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5433:5432
    restart: always
volumes:
  postgres-data: